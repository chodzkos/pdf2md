name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Skonfiguruj Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Zainstaluj zależności
        run: uv sync

      - name: Lint — ruff check
        run: uv run ruff check .

      - name: Format — ruff format check
        run: uv run ruff format --check .

      - name: Typy — mypy
        run: uv run mypy src/

      - name: Testy — pytest
        run: uv run pytest --cov=pdf2md --cov-report=xml -m "not integration and not gui"

      - name: Wyślij coverage (Ubuntu + Python 3.12)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Testuje, że deklaracja wsparcia 3.13 jest realna, a nie tylko deklarowana:
  # instaluje engines-core (koła cp313), sprawdza importy i robi smoke konwersji.
  engines-smoke-313:
    name: Engines smoke (Python 3.13, engines-core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Skonfiguruj Python 3.13
        run: uv python install 3.13

      - name: Zainstaluj engines-core (weryfikacja kół cp313)
        run: uv sync --extra engines-core --python 3.13

      - name: Import smoke — marker/surya/docling/cv2 na 3.13
        run: >
          uv run --python 3.13 python -c "import marker.config.parser, surya.foundation,
          surya.recognition, surya.detection, cv2, docling; print('imports OK')"

      - name: Cache modeli OCR (surya/datalab)
        uses: actions/cache@v4
        with:
          path: ~/.cache/datalab
          key: datalab-models-${{ runner.os }}

      - name: Smoke konwersji — Marker (CPU)
        run: |
          uv run --python 3.13 pdf2md convert tests/fixtures/test_text_1page.pdf \
            --engine marker -o "$RUNNER_TEMP/m.md"
          test -s "$RUNNER_TEMP/m.md" && echo "Marker utworzył .md na 3.13"
      # Surya wymaga GPU (requires_gpu) — niewykonalne na runnerach GH bez CUDA.
      # Konwersję Surya na 3.13 weryfikuje się lokalnie na GPU; tu pokrywa ją import smoke.
