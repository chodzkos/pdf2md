name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-pol

      - name: Install Python dependencies
        run: uv sync --extra pymupdf --extra docling

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Force CPU-only torch for standalone size
        run: |
          uv pip install --reinstall --index-url https://download.pytorch.org/whl/cpu torch==2.10.0+cpu torchvision==0.25.0+cpu
          uv pip uninstall cuda-bindings cuda-pathfinder nvidia-cublas-cu12 nvidia-cuda-cupti-cu12 nvidia-cuda-nvrtc-cu12 nvidia-cuda-runtime-cu12 nvidia-cudnn-cu12 nvidia-cufft-cu12 nvidia-cufile-cu12 nvidia-curand-cu12 nvidia-cusolver-cu12 nvidia-cusparse-cu12 nvidia-cusparselt-cu12 nvidia-nccl-cu12 nvidia-nvjitlink-cu12 nvidia-nvshmem-cu12 nvidia-nvtx-cu12 triton || true

      - name: Build binaries
        run: uv run pyinstaller build.spec --clean --noconfirm

      - name: Smoke test CLI
        run: |
          ./dist/pdf2md --help
          ./dist/pdf2md list-engines

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp dist/pdf2md release/pdf2md-linux
          cp dist/pdf2md-gui release/pdf2md-gui-linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2md-linux
          path: release/*

  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: choco install tesseract poppler -y

      - name: Install Python dependencies
        run: uv sync --extra pymupdf --extra docling

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Force CPU-only torch for standalone size
        shell: pwsh
        run: |
          uv pip install --reinstall --index-url https://download.pytorch.org/whl/cpu torch==2.10.0+cpu torchvision==0.25.0+cpu
          uv pip uninstall cuda-bindings cuda-pathfinder nvidia-cublas-cu12 nvidia-cuda-cupti-cu12 nvidia-cuda-nvrtc-cu12 nvidia-cuda-runtime-cu12 nvidia-cudnn-cu12 nvidia-cufft-cu12 nvidia-cufile-cu12 nvidia-curand-cu12 nvidia-cusolver-cu12 nvidia-cusparse-cu12 nvidia-cusparselt-cu12 nvidia-nccl-cu12 nvidia-nvjitlink-cu12 nvidia-nvshmem-cu12 nvidia-nvtx-cu12 triton
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CUDA packages already absent; continuing."
          }

      - name: Build binaries
        run: uv run pyinstaller build.spec --clean --noconfirm

      - name: Smoke test CLI
        run: |
          .\dist\pdf2md.exe --help
          .\dist\pdf2md.exe list-engines

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\pdf2md.exe release\pdf2md-windows.exe
          Copy-Item dist\pdf2md-gui.exe release\pdf2md-gui-windows.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2md-windows
          path: release/*

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(find release-artifacts -type f -print)"
          gh release create "${GITHUB_REF_NAME}" ${files} \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated pdf2md release. See CHANGELOG.md for details."
