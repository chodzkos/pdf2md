# Hooki NARZĘDZIOWE (ruff/ruff-format/mypy) wołają `uv run`, więc do działania pre-commit
# wymaga `uv` na PATH (language: system tego NIE instaluje). `uv run` używa tego samego
# środowiska co kanoniczne bramki — z gui-kit z gita, Qt i aktualnymi wersjami — dzięki czemu
# mypy realnie sprawdza CAŁY pakiet src/ (w tym GUI), zamiast izolowanego środowiska z pinami.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format .
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
