[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2md"
version = "1.0.0"
description = "Konwerter PDF do Markdown z obsługą wielu silników i modeli LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Marcin" }]
keywords = ["pdf", "markdown", "llm", "ocr", "conversion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

dependencies = [
    # security floor: CVE fix (pip-audit) — GHSA-4xgf-cpjx-pc3j (naprawione w 2.14.2).
    "pydantic-settings>=2.14.2",
    "loguru>=0.7",
    "rich>=13.7",
    "click>=8.1",
    "PySide6>=6.7",
    # security floor: CVE fix (pip-audit). Do 12.2.0: CVE-2026-25990/40192/42310/42311 +
    # PYSEC-2026-165. 12.3.0 domyka kolejne 8 advisory pillow (PYSEC-2026-2253..2257/3451..3453).
    # Cap pillow<11 z marker-pdf/surya-ocr nadpisany w [tool.uv] niżej.
    "Pillow>=12.3",
    "pyyaml>=6.0",
    "chodzkos-gui-kit[qt]",
    "chodzkos-detection",
]

[project.optional-dependencies]
pymupdf = [
    "pymupdf4llm>=0.0.17",
]
images = [
    "pymupdf>=1.27",
]
marker = [
    "marker-pdf>=1.10,<2",
]
docling = [
    "docling>=2.0",
]
engines-core = [
    "pymupdf4llm>=0.0.17",
    "marker-pdf>=1.10,<2",
    "docling>=2.0",
    "ebooklib>=0.18",
    "markdown-it-py>=4.2",
    "Pillow>=12.2",
    # torch/torchvision zadeklarowane JAWNIE (mimo że ciągną je marker-pdf/surya):
    # [tool.uv.sources] łapie tylko zadeklarowane pakiety, nie transitive — bez tego
    # źródło cu130 jest ignorowane i Windows dostaje wariant +cpu z PyPI.
    "torch>=2.12",
    "torchvision>=0.27",
]
llm = [
    "anthropic>=0.29",
    "openai>=1.35",
    "google-genai>=1.0",
]
scan = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "ebooklib>=0.18",
    "markdown-it-py>=4.2",
]

[project.scripts]
pdf2md = "pdf2md.cli.main:cli"

# gui-scripts: na Windows generuje exe podpięte pod podsystem GUI (PE subsystem = 2),
# więc uruchomienie pdf2md-gui NIE otwiera okna konsoli (odpowiednik pythonw).
[project.gui-scripts]
pdf2md-gui = "pdf2md.gui.app:main"

[project.urls]
Homepage = "https://github.com/chodzkos/pdf2md"
Repository = "https://github.com/chodzkos/pdf2md"
Issues = "https://github.com/chodzkos/pdf2md/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]
# ℹ (INFORMATION SOURCE) używane świadomie w komunikatach doctora (gradacja GPU).
allowed-confusables = ["ℹ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]
"src/pdf2md/gui/*" = ["N802"]  # Qt override methods must use camelCase

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src/pdf2md"]

[[tool.mypy.overrides]]
module = [
    "pymupdf4llm",
    "marker.*",
    "docling.*",
    "mineru.*",
    "torch",
    "torch.*",
    "cv2",
    "cv2.*",
    "pymupdf",
    "pymupdf.*",
    "numpy",
    "numpy.*",
    "surya.*",
    "paddleocr",
    "paddleocr.*",
    "PIL",
    "PIL.*",
    "ebooklib",
    "ebooklib.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdf2md.scan.*"]
disallow_untyped_calls = false

# ── Pytest ───────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not heavy and not integration'"
markers = [
    "integration: testy wymagające zewnętrznych zależności",
    "slow: wolne testy",
    "heavy: ciezkie testy ML, uruchamiane recznie",
    "gui: testy GUI",
]

# ── Coverage ─────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/pdf2md"]
branch = true
omit = ["*/gui/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.uv]
# marker-pdf i surya-ocr pinują pillow<11; CI (engines-smoke) i testy lokalne przechodzą
# na 12.3 — override zamiast ignore-vuln na niezałatane CVE w parserze obrazów.
# Weryfikować przy każdym podbiciu marker/surya.
override-dependencies = ["pillow>=12.3"]

[tool.uv.sources]
# Piny SHA zamiast tagów: tag jest mutowalny (można go przesunąć), SHA nie.
# Podbicie wersji = świadomy commit (chore: + testy), a nie cicha zmiana pod tagiem.
# Dependabot NIE obsługuje pinów git (poniżej) — te podbijamy ręcznie.
# v0.5.1 — podbicie = chore: + testy (config.json.broken-* backup + single-source version)
chodzkos-gui-kit = { git = "https://github.com/chodzkos/gui-kit", rev = "44e639881a7e86600efabe74ec0c8dc8c0114fd2" }
# v0.1.2 — podbicie = chore: + testy (find_tool + probe_tool executable + CREATE_NO_WINDOW)
chodzkos-detection = { git = "https://github.com/chodzkos/chodzkos-detection", rev = "6633745e17b170f991b8305448c3e5f96490b28f" }
# torch z PyPI na Windowsie = wariant CPU-only (+cpu) → Surya/Marker liczą na CPU
# mimo GPU. Indeks cu130 (torch 2.12.1) UNCONDITIONAL — oba systemy biorą
# 2.12.1+cu130 (jeden toolkit, bez kruchych per-platformowych pinów). Działa tylko
# bo torch/torchvision są zadeklarowane w engines-core (sources ignoruje transitive).
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

# explicit=true → indeks używany TYLKO dla pakietów, które go jawnie wskażą
# (torch/torchvision), nie dla reszty zależności.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
