[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2md"
version = "1.0.0"
description = "Konwerter PDF do Markdown z obsługą wielu silników i modeli LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Marcin" }]
keywords = ["pdf", "markdown", "llm", "ocr", "conversion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "rich>=13.7",
    "click>=8.1",
    "PySide6>=6.7",
]

[project.optional-dependencies]
pymupdf = [
    "pymupdf4llm>=0.0.17",
]
marker = [
    "marker-pdf>=0.2",
]
docling = [
    "docling>=2.0",
]
"pdf-craft" = [
    "pdf-craft>=0.1",
]
engines-core = [
    "pymupdf4llm>=0.0.17",
    "marker-pdf>=0.2",
    "docling>=2.0",
]
engines-optional = [
    "pdf-craft>=0.1",
]
llm = [
    "anthropic>=0.29",
    "openai>=1.35",
    "google-genai>=1.0",
]
scan = [
    "opencv-python>=4.8",
    "numpy>=1.26",
]

[project.scripts]
pdf2md = "pdf2md.cli.main:cli"
pdf2md-gui = "pdf2md.gui.app:main"

[project.urls]
Homepage = "https://github.com/chodzkos/pdf2md"
Repository = "https://github.com/chodzkos/pdf2md"
Issues = "https://github.com/chodzkos/pdf2md/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/pdf2md/gui/*" = ["N802"]  # Qt override methods must use camelCase

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src/pdf2md"]

[[tool.mypy.overrides]]
module = [
    "pymupdf4llm",
    "marker.*",
    "docling.*",
    "mineru.*",
    "pdf_craft.*",
    "torch",
    "torch.*",
    "cv2",
    "cv2.*",
    "pymupdf",
    "pymupdf.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdf2md.scan.*"]
disallow_untyped_calls = false

# ── Pytest ───────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not heavy and not integration'"
markers = [
    "integration: testy wymagające zewnętrznych zależności",
    "slow: wolne testy",
    "heavy: ciezkie testy ML, uruchamiane recznie",
    "gui: testy GUI",
]

# ── Coverage ─────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/pdf2md"]
branch = true
omit = ["*/gui/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
